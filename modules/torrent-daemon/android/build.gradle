plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.torrentdaemon'
version = '1.0.0'

// The gomobile-generated AAR (gitignored, regenerate with `gomobile bind`) cannot be
// referenced as a direct local .aar dependency: AGP 8.x rejects that when building an AAR.
// It is instead unpacked at build time: classes.jar becomes a local jar dependency (jars are
// packaged into library AARs) and the native libs feed the jniLibs source set.
def daemonAar = file('libs/daemon.aar')
def daemonExtractDir = file("$buildDir/daemon-aar")

def extractDaemonAarTask = tasks.register('extractDaemonAar') {
  inputs.files(daemonAar)
  outputs.dir(daemonExtractDir)
  doLast {
    delete daemonExtractDir
    copy {
      from zipTree(daemonAar)
      into daemonExtractDir
    }
  }
}

// Lazy Provider-backed file collections so Gradle can wire the implicit
// task dependency automatically (fixes Gradle 8 strict validation).
def daemonClassesJar = extractDaemonAarTask.map { new File(daemonExtractDir, 'classes.jar') }
def daemonJniDir     = extractDaemonAarTask.map { new File(daemonExtractDir, 'jni') }

// AGP does not preserve the producer task relationship for source-set dirs, so also
// declare an explicit dependency on extraction for every task that consumes its output.
tasks.configureEach { task ->
  if (task.name == 'extractDaemonAar') {
    return
  }
  if (task.name.endsWith('JniLibFolders') || task.name.endsWith('Aar') || task.name.startsWith('compile') || task.name.startsWith('process')) {
    dependsOn extractDaemonAarTask
  }
}

android {
  namespace "expo.modules.torrentdaemon"

  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles "proguard-consumer.pro"
  }
  sourceSets {
    main {
      jniLibs {
        srcDirs += daemonJniDir
      }
    }
  }
}

dependencies {
  // Gomobile bindings (classes only; native libs are wired via the jniLibs source set).
  // Using a Provider-backed FileCollection so Gradle tracks the dependency on
  // extractDaemonAar automatically (no implicit dependency warning in Gradle 8+).
  implementation files(daemonClassesJar)
}
